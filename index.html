<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熊本大同青果｜備品管理</title>
  <style id="embedded-style">
:root{--bg:#f5f7fa;--panel:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--primary:#245b8f;--primary2:#1d4d79;--danger:#b42318;--shadow:0 4px 18px rgba(15,23,42,.06)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.login-view{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef3f8,#f8fafc)}.login-card{width:min(420px,92vw);background:#fff;padding:38px;border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line)}.brand-mark{width:48px;height:48px;display:grid;place-items:center;background:var(--primary);color:#fff;border-radius:12px;font-weight:800;font-size:22px}.login-card h1{margin:18px 0 4px}.login-card p{margin:0 0 26px;color:var(--muted)}
label{display:flex;flex-direction:column;gap:7px;font-weight:650;font-size:14px;margin-bottom:14px}input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:10px 11px;background:#fff;outline:none}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(36,91,143,.1)}
.primary,.secondary,.logout,.icon-btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.secondary{background:#eef2f6;color:#334155}.full{width:100%}.error{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.app{min-height:100vh;display:flex}.sidebar{width:245px;background:#172b3d;color:#fff;padding:20px 14px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0}.sidebar-brand{display:flex;align-items:center;gap:10px;font-weight:800;padding:6px 10px 22px}.sidebar-brand>span{width:38px;height:38px;display:grid;place-items:center;background:#2f6d9f;border-radius:10px}.sidebar-brand small{display:block;color:#aab8c5;font-weight:500;font-size:10px;margin-top:2px}.sidebar nav{display:grid;gap:5px}.nav-btn{border:0;background:transparent;color:#d8e1e8;text-align:left;padding:12px 13px;border-radius:8px}.nav-btn:hover,.nav-btn.active{background:#27465e;color:#fff}.logout{margin-top:auto;background:#223c51;color:#fff}
.main{margin-left:245px;width:calc(100% - 245px);padding:24px 30px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.topbar h2{margin:0 0 3px;font-size:25px}.topbar span{color:var(--muted);font-size:13px}.icon-btn{display:none}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow)}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:28px;margin-top:5px}.stat.warning{border-color:#f3d7a2}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panel-head h3{margin:0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar input{flex:1;min-width:240px}.toolbar select{width:180px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f8fafc;color:#475569;font-weight:750}tr.clickable:hover{background:#f8fafc;cursor:pointer}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f6}.badge.ok{background:#e8f5ec;color:#166534}.badge.use{background:#e9f0fb;color:#1d4d79}.badge.repair{background:#fff4d6;color:#8a5a00}.badge.dispose{background:#f5e7e7;color:#8f2d2d}
dialog{border:0;border-radius:15px;padding:0;width:min(720px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.22)}dialog::backdrop{background:rgba(15,23,42,.45)}.dialog-card{padding:22px}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.dialog-head h3{margin:0}.close{border:0;background:transparent;font-size:25px;color:#64748b}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.full-row{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-item{padding:12px;background:#f8fafc;border-radius:9px}.detail-item small{display:block;color:var(--muted);margin-bottom:3px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.master-list{display:flex;flex-direction:column;gap:8px}.master-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 2px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.2s;z-index:5}.sidebar.open{transform:none}.main{margin-left:0;width:100%;padding:18px}.icon-btn{display:block;background:#eef2f6}.cards{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr}.form-grid,.detail-grid{grid-template-columns:1fr}.full-row{grid-column:auto}}


@media(max-width:600px){
 body{font-size:15px}.login-view{padding:16px;align-items:center}.login-card{width:100%;padding:24px 18px;border-radius:14px}.login-card h1{font-size:23px}.login-card input{min-height:48px;font-size:16px}.login-card .primary{min-height:50px;font-size:16px}
 .main{padding:12px}.topbar{gap:10px;margin-bottom:14px}.topbar h2{font-size:20px}.topbar span{font-size:11px}.icon-btn{min-width:44px;min-height:44px;font-size:20px}
 .sidebar{width:min(82vw,300px);padding:16px 12px}.nav-btn,.logout{min-height:48px;font-size:15px}
 .cards{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px 12px}.stat strong{font-size:23px}.panel{padding:12px;border-radius:11px}.panel-head{align-items:flex-start;flex-direction:column}.panel-head .primary{width:100%;min-height:46px}
 .toolbar{display:grid;grid-template-columns:1fr;gap:8px}.toolbar input,.toolbar select,.toolbar button{width:100%;min-width:0;min-height:46px;font-size:16px}
 .table-wrap{margin:0 -12px;padding:0 12px}.table-wrap table{min-width:620px}th,td{padding:11px 8px;font-size:12px}
 dialog{width:calc(100vw - 16px);max-height:92vh}.dialog-card{padding:16px}.dialog-actions{position:sticky;bottom:0;background:#fff;padding-top:10px}.dialog-actions button{flex:1;min-height:46px}
 input,select,textarea{font-size:16px;min-height:44px}.detail-item{padding:10px}.master-row{gap:8px;align-items:center}
}

</style>

<style id="daido-brand-restored">
:root{
 --bg:#f4f8f6;--panel:#fff;--text:#153246;--muted:#668078;--line:#dbe8e3;
 --primary:#075b9b;--primary2:#073b67;--green:#58a832;--green2:#79bd43;
 --danger:#b42318;--shadow:0 10px 28px rgba(10,68,75,.075);
}
html{background:#f4f8f6}body{
 background:
 radial-gradient(circle at 100% 0%,rgba(20,136,201,.075),transparent 28rem),
 radial-gradient(circle at 0% 100%,rgba(121,189,67,.07),transparent 30rem),#f4f8f6;
 color:var(--text)
}
/* login */
.login-view{background:linear-gradient(145deg,#eaf6f0 0%,#edf6fb 52%,#f8fbfa 100%);padding:24px}
.login-card{border:1px solid #dce9e4;border-top:6px solid var(--green);border-radius:22px;box-shadow:0 24px 60px rgba(5,82,91,.14);position:relative;overflow:hidden}
.login-card:before{content:"KUMAMOTO DAIDO SEIKA";position:absolute;right:18px;top:16px;font-size:9px;letter-spacing:.14em;font-weight:800;color:#86a398}
.brand-mark{background:linear-gradient(135deg,#075b9b 0%,#1488c9 48%,#58a832 100%);border-radius:15px;box-shadow:0 8px 20px rgba(7,91,155,.18)}
.login-card h1{color:#0c416b;letter-spacing:.02em}.login-card p{color:#638077}
/* corporate shell */
.sidebar{background:linear-gradient(165deg,#073b67 0%,#075b9b 48%,#197f73 78%,#3e8c3c 130%);box-shadow:10px 0 36px rgba(7,59,103,.12)}
.sidebar-brand{position:relative}.sidebar-brand:after{content:"FRESH × TRUST × MANAGEMENT";position:absolute;left:58px;top:49px;font-size:7px;letter-spacing:.11em;color:#a6dbbd;font-weight:700}
.sidebar-brand>span{background:linear-gradient(135deg,#1488c9,#58a832);box-shadow:0 8px 20px rgba(0,0,0,.16)}
.sidebar-brand small{color:#b8d8d0}.nav-btn{color:#e5f0f0;border:1px solid transparent;font-weight:650;transition:.18s}
.nav-btn:hover{background:rgba(255,255,255,.08)}
.nav-btn.active{background:linear-gradient(90deg,rgba(20,136,201,.72),rgba(88,168,50,.58));border-color:rgba(196,235,172,.13);box-shadow:inset 3px 0 0 #9ad565;color:#fff}
.logout{background:rgba(4,45,67,.35);border:1px solid rgba(255,255,255,.09)}
.main{background:transparent}.topbar h2{color:#0c416b;letter-spacing:.01em}.connection-status{margin-left:8px;color:#4f866c!important}
/* cards & controls */
.stat,.panel{border:1px solid var(--line);box-shadow:var(--shadow);background:rgba(255,255,255,.97)}
.stat{position:relative;overflow:hidden;border-radius:15px}.stat:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#075b9b,#1488c9 52%,#58a832)}
.stat:nth-child(2):after{background:linear-gradient(90deg,#2f7f39,#79bd43)}
.stat strong{color:#123e5c}.stat span{color:#678078}.panel{border-radius:15px}.panel-head h3{color:#173f59}
.primary{background:linear-gradient(120deg,#075b9b 0%,#1488c9 48%,#58a832 100%);box-shadow:0 6px 16px rgba(7,91,155,.17)}
.primary:hover{filter:brightness(.96)}.secondary{background:#edf4f2;color:#355e55;border:1px solid #dce8e3}
input,select,textarea{border-color:#ccddd7;border-radius:11px}input:focus,select:focus,textarea:focus{border-color:#3f9d70;box-shadow:0 0 0 3px rgba(63,157,112,.11)}
th{background:linear-gradient(90deg,#f0f6f8,#f2f8f3);color:#4c7165}tr.clickable:hover{background:#f4faf5}.badge.ok{background:#e8f5df;color:#35762e}.badge.use{background:#e5f2f9;color:#075b83}
dialog{border-radius:18px;box-shadow:0 28px 90px rgba(5,38,58,.26)}dialog::backdrop{background:rgba(4,30,47,.55);backdrop-filter:blur(3px)}
/* mobile: company system + thumb friendly */
@media(max-width:800px){
 body{padding-bottom:84px}.main{padding:14px 12px 96px}.topbar{position:sticky;top:0;z-index:20;background:rgba(244,248,246,.91);backdrop-filter:blur(14px);padding:10px 2px 12px;margin:-4px 0 12px;border-bottom:1px solid rgba(7,91,155,.07)}
 .topbar h2{font-size:21px}.icon-btn{display:none!important}
 .sidebar{transform:none!important;position:static!important;width:auto!important;min-height:0!important;padding:10px 12px;background:linear-gradient(100deg,#073b67,#075b9b 55%,#327f50);box-shadow:none}
 .sidebar-brand{padding:2px 4px 7px}.sidebar-brand:after{display:none}.sidebar-brand small{display:none}
 .sidebar nav{position:fixed;z-index:999;left:9px;right:9px;bottom:9px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;background:linear-gradient(110deg,rgba(7,59,103,.97),rgba(7,91,155,.97) 55%,rgba(47,127,57,.96));border:1px solid rgba(154,213,101,.16);border-radius:18px;box-shadow:0 16px 42px rgba(3,36,54,.30);backdrop-filter:blur(18px)}
 .nav-btn{min-height:50px;padding:7px 3px;text-align:center;font-size:10px;border-radius:11px;line-height:1.2}.nav-btn.active{box-shadow:none;background:linear-gradient(135deg,#1488c9,#58a832)}
 .logout{display:none}.cards{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:14px 12px;border-radius:14px}.stat strong{font-size:25px}
 .panel{border-radius:14px;padding:12px}.toolbar{display:grid;grid-template-columns:1fr;gap:8px}.toolbar input,.toolbar select,.toolbar button{width:100%;min-width:0;min-height:48px;font-size:16px}
 .panel-head{align-items:stretch}.panel-head button{min-height:46px}.table-wrap{margin:0 -12px;padding:0 12px;-webkit-overflow-scrolling:touch}.table-wrap:after{content:"← 横にスワイプできます →";display:block;text-align:center;color:#769087;font-size:10px;padding:7px 0 2px}
 dialog{width:calc(100vw - 14px);max-height:94vh;border-radius:17px}.dialog-card{padding:16px}.dialog-actions{position:sticky;bottom:0;background:#fff;padding:12px 0 2px}.dialog-actions button{min-height:48px}
}
@media(max-width:430px){.cards{gap:7px}.stat span{font-size:11px}.stat strong{font-size:23px}.nav-btn{font-size:9.5px}.login-card{padding:26px 20px}.login-card h1{font-size:23px}}
</style>

@media(max-width:800px){
  body{padding-bottom:88px}
  .app{display:block!important;min-height:100vh}

<style id="login-gate-mobile-v3">
/* ログイン中は業務画面を見せない */
body:has(.login-view:not(.hidden)) .app,
body:has(.login-view:not(.hidden)) #app,
body:has(.login-view:not(.hidden)) .sidebar nav {
  display:none !important;
}
</style>
<style id="two-photo-mobile-fix">
@media(max-width:560px){#detailPhotos{grid-template-columns:1fr!important}#detailPhoto,#detailLabelPhoto{height:auto!important;max-height:300px}}
</style></head>
<body>
  <div id="loginView" class="login-view">
    <div class="login-card">
      <div class="brand-mark">備</div>
      <h1>熊本大同青果｜備品管理</h1>
      <p>家電・備品・購入品を安全に一元管理</p>
      <form id="loginForm">
        <label>メールアドレス<input id="loginEmail" type="email" required autocomplete="email"></label>
        <label>パスワード<input id="loginPassword" type="password" required autocomplete="current-password"></label>
        <button class="primary full" type="submit">ログイン</button>
        <div id="loginError" class="error"></div>
      </form>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand"><span>備</span><div>備品管理システム<small>KUMAMOTO DAIDO SEIKA</small></div></div>
      <nav>
        <button data-page="dashboard" class="nav-btn active">ダッシュボード</button>
        <button data-page="assets" class="nav-btn">備品一覧</button>
        
        <button data-page="history" class="nav-btn">履歴</button>
        <button data-page="admin" class="nav-btn admin-only hidden">管理</button>
      </nav>
      <button id="logoutBtn" class="logout">ログアウト</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">ダッシュボード</h2>
          <span id="userInfo"></span><span id="connectionStatus" class="connection-status">接続確認中…</span>
        </div>
        <button id="mobileMenu" class="icon-btn">☰</button>
      </header>

      <section id="dashboardPage" class="page">
        <div class="cards">
          <div class="stat"><span>総備品数</span><strong id="statTotal">-</strong></div>
          <div class="stat"><span>未使用</span><strong id="statAvailable">-</strong></div>
          <div class="stat"><span>使用中</span><strong id="statUse">-</strong></div>
          <div class="stat"><span>修理中</span><strong id="statRepair">-</strong></div>
          <div class="stat"><span>廃棄</span><strong id="statDisposed">-</strong></div>
          <div class="stat warning"><span>写真登録済み</span><strong id="statPhoto">-</strong></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>最近の備品</h3><button class="secondary" data-go="assets">一覧を見る</button></div>
          <div id="recentAssets" class="table-wrap"></div>
        </div>
      </section>

      <section id="assetsPage" class="page hidden">
        <div class="toolbar">
          <input id="assetSearch" placeholder="備品番号・備品名・メーカー・型番で検索">
          <select id="assetStatus"><option value="">すべての状態</option><option>未使用</option><option>使用中</option><option>修理中</option><option>廃棄</option></select>
          <select id="assetCategory"><option value="">すべてのカテゴリ</option></select>
          <button id="newAssetBtn" class="primary admin-only hidden">＋ 備品登録</button>
        </div>
        <div id="assetTable" class="table-wrap"></div>
      </section>

      <section id="historyPage" class="page hidden">
        <div class="panel"><div class="panel-head"><h3>備品履歴</h3></div><div id="historyTable" class="table-wrap"></div></div>
      </section>

      <section id="adminPage" class="page hidden">
        <div class="admin-grid">
          <div class="panel">
            <div class="panel-head"><h3>社員・権限</h3></div>
            <div id="profileTable" class="table-wrap"></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h3>カテゴリ</h3></div>
            <div id="categoryAdmin" class="master-list"></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h3>保管場所</h3></div>
            <div id="locationAdmin" class="master-list"></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h3>部署</h3></div>
            <div id="departmentAdmin" class="master-list"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="assetDialog">
    <form method="dialog" id="assetForm" class="dialog-card">
      <div class="dialog-head"><h3 id="assetDialogTitle">備品登録</h3><button value="cancel" class="close">×</button></div>
      <input type="hidden" id="assetId">
      <div class="form-grid">
        <label>管理No.*<input id="assetNo" required></label>
        <label>名称*<input id="assetName" required></label>
        <label>メーカー<input id="manufacturer"></label>
        <label>取得年月日<input id="purchaseDate" type="date"></label>
        <label>取得方法<input id="acquisitionMethod" placeholder="新規・中古・譲渡など"></label>
        <label>取得単価<input id="purchasePrice" type="number" min="0" step="0.01"></label>
        <label>購入部署<select id="departmentForm"></select></label>
        <label>使用・保管場所<select id="locationForm"></select></label>
        <label>現在の使用者<input id="currentUserName" placeholder="未使用の場合は空欄"></label>
        <label>ステータス<select id="statusForm"><option>未使用</option><option>使用中</option><option>修理中</option><option>廃棄</option></select></label>
        <label class="full-row">現物写真① 外観
          <input id="assetPhoto" type="file" accept="image/*" capture="environment">
          <small style="font-weight:500;color:var(--muted)">備品全体が分かる写真（スマホでその場で撮影できます／10MBまで）</small>
          <img id="assetPhotoPreview" class="hidden" alt="備品外観写真プレビュー" style="margin-top:8px;max-width:100%;max-height:260px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#f8fafc">
        </label>
        <label class="full-row">現物写真② ラベル・型番
          <input id="assetLabelPhoto" type="file" accept="image/*" capture="environment">
          <small style="font-weight:500;color:var(--muted)">メーカーラベル・型番・製造番号などが読める写真（10MBまで）</small>
          <img id="assetLabelPhotoPreview" class="hidden" alt="備品ラベル写真プレビュー" style="margin-top:8px;max-width:100%;max-height:260px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#f8fafc">
        </label>
        <label class="full-row">備考<textarea id="note"></textarea></label>

        <!-- 既存DB互換のため保持。画面デザインには出さない -->
        <div class="hidden">
          <select id="assetCategoryForm"><option value="">その他</option></select>
          <input id="model">
          <input id="quantity" type="number" value="1">
          <input id="unit" value="個">
        </div>
      </div>
      <div class="dialog-actions"><button value="cancel" class="secondary">キャンセル</button><button id="saveAssetBtn" class="primary" value="default">保存</button></div>
      <div id="assetFormError" class="error"></div>
    </form>
