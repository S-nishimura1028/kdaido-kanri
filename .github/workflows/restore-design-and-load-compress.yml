name: Restore Design And Load Compress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-design-and-load-compress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load compression script without replacing page design
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='  <script src="js/image-compress.js"></script>\n'
          anchor='  <script src="js/app.js"></script>'
          if 'js/image-compress.js' not in s:
              if anchor not in s:
                  raise SystemExit('app.js anchor not found')
              s=s.replace(anchor,tag+anchor,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore full design and safely enable photo compression'
          git push
