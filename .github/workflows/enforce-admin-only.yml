name: Enforce Admin Only Accounts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enforce-admin-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply admin-only account policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('js/app.js')
          s = app.read_text(encoding='utf-8')
          s = s.replace("function roleLabel(r){return ({employee:'一般社員',manager:'管理担当者',admin:'管理者'}[r]||'一般社員')}\n  function isManager(){return ['manager','admin'].includes(profile?.role)}",
                        "function roleLabel(r){return r==='admin'?'管理者':'権限なし'}\n  function isManager(){return profile?.role==='admin'}")
          s = s.replace("const up=await db.from('profiles').upsert({id:user.id,name:user.email?.split('@')[0]||'ユーザー',email:user.email},{onConflict:'id'});",
                        "const up=await db.from('profiles').upsert({id:user.id,name:user.email?.split('@')[0]||'ユーザー',email:user.email,role:'admin'},{onConflict:'id'});")
          marker = "      $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');"
          guard = "      if(profile?.role!=='admin'){await db.auth.signOut();showLogin();showError('このアカウントには管理者権限がありません。');return;}\n"
          if guard.strip() not in s:
              s = s.replace(marker, guard + marker, 1)
          pattern = r"  async function loadAdmin\(\)\{.*?\}\n  window\.addEventListener\('DOMContentLoaded',init\);"
          replacement = """  async function loadAdmin(){
    const p=await db.from('profiles').select('*').order('name');
    if(p.error){$('profileTable').innerHTML=`<div class=\"error\">${esc(p.error.message)}</div>`;return;}
    const rows=(p.data||[]).filter(x=>x.role==='admin');
    $('profileTable').innerHTML=`<div style=\"padding:10px 0 14px;color:var(--muted);font-size:13px\">ログインできるアカウントはすべて管理者です。一般社員はログインせず、QRから閲覧します。</div>`+(rows.length?rows.map(x=>`<div class=\"master-row\"><span><strong>${esc(x.name||'管理者')}</strong><small style=\"display:block;color:var(--muted)\">${esc(x.email||'')}</small></span><div style=\"display:flex;gap:8px;align-items:center\"><span class=\"badge use\">管理者</span><button type=\"button\" class=\"secondary profile-name-edit\" data-profile=\"${x.id}\" data-name=\"${esc(x.name||'')}\">名前編集</button></div></div>`).join(''):'<div class=\"empty\">管理者アカウントはありません。</div>');
    $('profileTable').querySelectorAll('.profile-name-edit').forEach(b=>b.onclick=async()=>{const name=prompt('表示名を入力してください',b.dataset.name||'');if(!name||!name.trim())return;const r=await db.from('profiles').update({name:name.trim(),role:'admin'}).eq('id',b.dataset.profile);if(r.error){alert('名前を更新できませんでした: '+r.error.message);return;}await loadAdmin();});
    [['categoryAdmin',categories],['locationAdmin',locations],['departmentAdmin',departments]].forEach(([id,list])=>$(id).innerHTML=list.map(x=>`<div class=\"master-row\"><span>${esc(x.name)}</span></div>`).join(''));
  }
  window.addEventListener('DOMContentLoaded',init);"""
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('loadAdmin block not found')
          app.write_text(s2, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('<div class="panel-head"><h3>社員・権限</h3></div>', '<div class="panel-head"><h3>管理者アカウント</h3></div>', 1)
          index.write_text(h, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js index.html
          git commit -m 'Restrict app login to administrators and simplify account management'
          git push
