name: Fix QR CDN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-qr-cdn.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken QRCode CDN version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js'
          new = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js'
          if old not in s:
              print('QR CDN already fixed or target not found')
          else:
              p.write_text(s.replace(old, new), encoding='utf-8')
              print('QR CDN fixed')
          PY
      - name: Commit fix if changed
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix QR code library loading on mobile'
          git push
